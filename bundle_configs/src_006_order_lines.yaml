source_name: src_006_order_lines
source_path: /Volumes/mdd_platform/landing/source_files/src_006_order_lines
format: csv
options:
  header: 'true'
  delimiter: ','
  multiLine: 'true'
description: Order line items from OMS - composite key (order_id, line_no)
columns:
- name: order_id
  type: string
  length: 20
  comment: FK to src_002_orders (composite key part 1)
- name: line_no
  type: int
  comment: Line number within order (composite key part 2)
- name: product_id
  type: string
  length: 20
  comment: FK to src_005_products
- name: quantity
  type: int
  comment: Units ordered
- name: unit_price
  type: decimal(10,2)
  comment: Price per unit
- name: discount_pct
  type: int
  comment: Discount percentage 0-100
business_keys:
- order_id
- line_no
pii_columns: {}
quality_rules:
- name: order_id_not_null
  rule: not_null
  column: order_id
- name: line_no_not_null
  rule: not_null
  column: line_no
- name: quantity_range
  rule: range
  column: quantity
  min: 1
  max: 100
- name: discount_range
  rule: range
  column: discount_pct
  min: 0
  max: 100
bronze:
  target_table: mdd_platform.bronze.src_006_order_lines
  comment: Raw landing zone for OMS order line items - composite-key test source
  partition_by:
  - _ingest_date
  table_properties:
    delta.deletedFileRetentionDuration: interval 7 days
    mdd.quality_layer: bronze
    mdd.source_system: OMS
  exception_rules:
    max_rescued_pct: 15
    on_exceed: warn
quarantine_action: route_and_log
merge_strategy: scd1+scd2
silver:
  target_table: mdd_platform.silver.src_006_order_lines
  comment: Conformed order lines - composite key (order_id, line_no), typed, deduped
  business_keys:
  - order_id
  - line_no
  merge_keys:
  - order_id
  - line_no
  merge_strategy: scd1+scd2
  table_properties:
    delta.deletedFileRetentionDuration: interval 7 days
    mdd.quality_layer: silver
  cluster_by:
  - order_id
  - line_no
  transformations: []
  exclude_columns: []
